name: Generate Snake

on:
  # Run daily to keep the snake fresh with recent contributions.
  schedule:
    - cron: "0 0 * * *"
  # Allow manual trigger.
  workflow_dispatch:
  # Regenerate on every push to main so changes get reflected.
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the SVG snake from the user's contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Two variants: light (default) and dark — the portfolio uses dark.
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
